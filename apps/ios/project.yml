name: Slate
options:
  bundleIdPrefix: com.rio.slate
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
targets:
  Slate:
    type: application
    platform: iOS
    sources:
      - Slate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rio.slate
        INFOPLIST_FILE: Slate/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SlateTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SlateTests]
    dependencies:
      - target: Slate
  SlateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SlateUITests]
    dependencies:
      - target: Slate
schemes:
  Slate:
    build:
      targets:
        Slate: all
    test:
      targets: [SlateTests, SlateUITests]
      gatherCoverageData: true
      environmentVariables:
        SLATE_INTEGRATION: "$(SLATE_INTEGRATION)"
        SLATE_UI_INTEGRATION: "$(SLATE_UI_INTEGRATION)"
        SLATE_API_URL: "$(SLATE_API_URL)"

